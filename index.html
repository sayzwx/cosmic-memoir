<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CosmicMemoir - 奇点验证</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020205;
      font-family: 'Noto Serif SC', serif;
    }
    #root {
      width: 100%;
      height: 100%;
      position: relative;
    }
  </style>
  <script>
    (function () {
      var TOKEN_KEY = 'cm_token';
      var LOGIN_TIME_KEY = 'cm_loginTime';
      var SESSION_TIMEOUT = 3600000;

      var token = sessionStorage.getItem(TOKEN_KEY);
      var loginTime = sessionStorage.getItem(LOGIN_TIME_KEY);

      if (token && loginTime) {
        var elapsed = Date.now() - parseInt(loginTime, 10);
        if (elapsed < SESSION_TIMEOUT) {
          window.location.replace('./universe.html');
        }
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
