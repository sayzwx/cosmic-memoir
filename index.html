<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CosmicMemoir - 奇点验证</title>
  <link rel="preconnect" href="https://fonts.googleapis.cn">
  <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin>
  <link href="https://fonts.googleapis.cn/css2?family=Noto+Serif+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020205;
      font-family: 'Noto Serif SC', serif;
    }
    #root {
      width: 100%;
      height: 100%;
      position: relative;
    }
  </style>
  <script>
    (function () {
      var TOKEN_KEY = 'cm_token';
      var LOGIN_TIME_KEY = 'cm_loginTime';
      var FAILED_KEY = 'cm_failedAttempts';
      var LOCK_KEY = 'cm_lockUntil';
      var SESSION_TIMEOUT = 3600000;

      // Support ?logout to clear session and return to login
      if (window.location.search.indexOf('logout') !== -1) {
        sessionStorage.removeItem(TOKEN_KEY);
        sessionStorage.removeItem(LOGIN_TIME_KEY);
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(LOGIN_TIME_KEY);
        localStorage.removeItem(FAILED_KEY);
        localStorage.removeItem(LOCK_KEY);
        window.location.replace(window.location.pathname);
        return;
      }

      var token = sessionStorage.getItem(TOKEN_KEY) || localStorage.getItem(TOKEN_KEY);
      var loginTime = sessionStorage.getItem(LOGIN_TIME_KEY) || localStorage.getItem(LOGIN_TIME_KEY);

      if (token && loginTime) {
        var elapsed = Date.now() - parseInt(loginTime, 10);
        if (elapsed < SESSION_TIMEOUT) {
          sessionStorage.setItem(TOKEN_KEY, token);
          sessionStorage.setItem(LOGIN_TIME_KEY, loginTime);
          window.location.replace('./universe.html');
        } else {
          sessionStorage.removeItem(TOKEN_KEY);
          sessionStorage.removeItem(LOGIN_TIME_KEY);
          localStorage.removeItem(TOKEN_KEY);
          localStorage.removeItem(LOGIN_TIME_KEY);
        }
      }
    })();
  </script>
  <script>
    // The archived login bundle starts a four-second tunnel but redirects after
    // 1.2 seconds. Extend only that legacy transition timer before it loads.
    (function () {
      var nativeSetTimeout = window.setTimeout;
      window.setTimeout = function (callback, delay) {
        return nativeSetTimeout.call(window, callback, delay === 1200 ? 4200 : delay);
      };
    })();
  </script>
  <script type="module" crossorigin src="./assets/index-BGHynaiA.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CstZTXpl.css">
</head>
<body>
  <div id="root"></div>
</body>
</html>
